name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke-test ESM artifact in Node
        run: node -e "import('./dist/index.js').then(cc => { if (cc.code('EUR').digits !== 2) { console.error('EUR digits mismatch'); process.exit(1); } if (cc.code('XAU').digits !== null) { console.error('XAU digits mismatch'); process.exit(1); } })"
