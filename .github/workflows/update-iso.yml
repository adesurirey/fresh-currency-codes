name: Update ISO 4217 data

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch + ingest ISO XML
        run: bun run iso

      - name: Sanity-check the diff
        run: bun run sanity-check

      - name: Detect data changes
        id: data
        run: |
          if git diff --quiet HEAD -- src/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ISO 4217 data is already in sync with main; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update snapshots
        if: steps.data.outputs.changed == 'true'
        run: bun run test:update

      - name: Bump patch version
        if: steps.data.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Compute diff summary
        if: steps.data.outputs.changed == 'true'
        id: diff
        run: |
          set -euo pipefail
          git show HEAD:src/data.json > /tmp/prev-data.json

          PUBLISH_DATE=$(jq -r .publishDate src/data.json)

          ADDED=$(jq -n \
            --slurpfile current src/data.json \
            --slurpfile prev /tmp/prev-data.json \
            '
            ($current[0].currencies | map(.code)) as $cur
            | ($prev[0].currencies | map(.code)) as $pre
            | ($cur - $pre) | length
            ')

          DEPRECATED=$(jq -n \
            --slurpfile current src/data.json \
            --slurpfile prev /tmp/prev-data.json \
            '
            ($prev[0].currencies | map({(.code): .active}) | add) as $prevActiveByCode
            | $current[0].currencies
            | map(select(.active == false and $prevActiveByCode[.code] == true))
            | length
            ')

          echo "publishDate=$PUBLISH_DATE" >> "$GITHUB_OUTPUT"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "deprecated=$DEPRECATED" >> "$GITHUB_OUTPUT"

      - name: Open refresh PR
        if: steps.data.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_PAT }}
          branch: data-refresh/iso-${{ steps.diff.outputs.publishDate }}
          base: main
          title: "chore: refresh ISO 4217 data (${{ steps.diff.outputs.publishDate }}) — +${{ steps.diff.outputs.added }} added, +${{ steps.diff.outputs.deprecated }} deprecated"
          commit-message: "chore: refresh ISO 4217 data (${{ steps.diff.outputs.publishDate }})"
          body: |
            Auto-generated by `update-iso.yml`.

            - Publish date: `${{ steps.diff.outputs.publishDate }}`
            - Added: ${{ steps.diff.outputs.added }}
            - Deprecated: ${{ steps.diff.outputs.deprecated }}
          labels: data-refresh
          delete-branch: true
