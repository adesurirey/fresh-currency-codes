name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # npm Trusted Publishing (OIDC) — no NPM_TOKEN. Requires a trusted
      # publisher on npmjs.com for this repo + publish.yml. Node 24 ships
      # npm ≥ 11.5.1. Do not pass registry-url to setup-node here: it writes
      # an empty _authToken line that blocks OIDC (see actions/setup-node#1551).
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Publish to npm if not already published
        id: npm
        run: |
          set -euo pipefail
          npm --version | awk -F. '{ exit !($1>11 || ($1==11 && $2>=5)) }' || {
            echo "::error::npm $(npm --version) is too old; need >= 11.5.1 for trusted publishing"
            exit 1
          }

          LOCAL=$(jq -r .version package.json)
          PKG=$(jq -r .name package.json)
          PUBLISHED=$(npm view "$PKG" version --registry https://registry.npmjs.org 2>/dev/null || echo "")

          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "::notice::Already published $PKG@$LOCAL; skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm publish --access public --provenance --registry https://registry.npmjs.org
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r .version package.json)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
