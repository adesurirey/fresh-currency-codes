name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm if not already published
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN not configured; skipping publish (expected pre-launch)"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL=$(jq -r .version package.json)
          PKG=$(jq -r .name package.json)
          PUBLISHED=$(npm view "$PKG" version 2>/dev/null || echo "")

          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "::notice::Already published $PKG@$LOCAL; skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm publish --access public --provenance
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r .version package.json)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
